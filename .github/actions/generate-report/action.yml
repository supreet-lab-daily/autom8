name: 'Generate Test Report'
description: 'Generate comprehensive test report with coverage and committer info'

inputs:
  test_results_path:
    description: 'Path to test results JSON file'
    required: true
  coverage_threshold:
    description: 'Minimum coverage percentage threshold'
    required: false
    default: '95'
  report_format:
    description: 'Report format (json, markdown, or both)'
    required: false
    default: 'json'

outputs:
  report_path:
    description: 'Path to generated report file'
    value: ${{ steps.generate.outputs.report_path }}
  failing_classes_count:
    description: 'Number of failing classes'
    value: ${{ steps.generate.outputs.failing_classes_count }}
  low_coverage_count:
    description: 'Number of classes below coverage threshold'
    value: ${{ steps.generate.outputs.low_coverage_count }}

runs:
  using: 'composite'
  steps:
    - name: Install jq
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y jq || true
    
    - name: Generate Report
      id: generate
      shell: bash
      run: |
        mkdir -p reports
        
        # Read test results
        if [ ! -f "${{ inputs.test_results_path }}" ]; then
          echo "Error: Test results file not found at ${{ inputs.test_results_path }}"
          exit 1
        fi
        
        # Extract summary
        SUMMARY=$(jq -r '.summary // {}' "${{ inputs.test_results_path }}")
        TESTS=$(jq -r '.tests // []' "${{ inputs.test_results_path }}")
        COVERAGE=$(jq -r '.codeCoverage // []' "${{ inputs.test_results_path }}")
        
        # Get failing classes with committer info
        FAILING_CLASSES=$(echo "$TESTS" | jq -r '[.[] | select(.Outcome == "Fail") | .ClassName] | unique | .[]' | sort -u)
        FAILING_COUNT=$(echo "$FAILING_CLASSES" | grep -c . || echo "0")
        
        # Process failing classes with committer info
        FAILING_CLASSES_JSON="[]"
        if [ "$FAILING_COUNT" -gt 0 ]; then
          FAILING_CLASSES_JSON=$(echo "$FAILING_CLASSES" | while read -r CLASS_NAME; do
            if [ -n "$CLASS_NAME" ]; then
              # Try to find committer info
              COMMITTER_INFO=$(git log -1 --format='{"name":"%an","email":"%ae","date":"%ad"}' --date=iso --all -- "*${CLASS_NAME}*" 2>/dev/null | head -1 || echo 'null')
              if [ "$COMMITTER_INFO" = "null" ] || [ -z "$COMMITTER_INFO" ]; then
                COMMITTER_INFO='{"name":null,"email":null,"date":null}'
              fi
              echo "{\"className\":\"$CLASS_NAME\",\"lastCommitter\":$COMMITTER_INFO}"
            fi
          done | jq -s '.')
        fi
        
        # Get low coverage classes
        THRESHOLD=${{ inputs.coverage_threshold }}
        LOW_COVERAGE=$(echo "$COVERAGE" | jq -r --arg threshold "$THRESHOLD" '
          ($threshold | tonumber) as $thresholdNum |
          [.[] | 
            select(.numLocations > 0) |
            . as $cov |
            (($cov.numLocations - ($cov.numLocationsNotCovered // 0)) / $cov.numLocations * 100) as $percent |
            select($percent < $thresholdNum) |
            {
              className: ($cov.name // $cov.ApexClass.Name),
              coveragePercent: ($percent | tostring | .[0:5]),
              linesCovered: ($cov.numLocations - ($cov.numLocationsNotCovered // 0)),
              linesTotal: $cov.numLocations
            }
          ]
        ')
        LOW_COVERAGE_COUNT=$(echo "$LOW_COVERAGE" | jq 'length')
        
        # Build comprehensive report
        REPORT=$(jq -n \
          --argjson summary "$SUMMARY" \
          --argjson failing "$FAILING_CLASSES_JSON" \
          --argjson lowCoverage "$LOW_COVERAGE" \
          --arg threshold "$THRESHOLD" \
          --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
          '{
            timestamp: $timestamp,
            summary: {
              totalTests: ($summary.totalTests // 0),
              passed: ($summary.passed // 0),
              failed: ($summary.failures // 0),
              skipped: ($summary.skipped // 0),
              totalDuration: ($summary.testExecutionTime // 0),
              overallCoverage: (if ($summary.totalLines // 0) > 0 then ((($summary.totalLinesCovered // 0) / $summary.totalLines) * 100 | tostring | .[0:5] + "%") else "N/A" end)
            },
            failingClasses: $failing,
            lowCoverageClasses: $lowCoverage,
            metadata: {
              coverageThreshold: ($threshold | tonumber),
              testLevel: "RunAllTestsInOrg"
            }
          }')
        
        # Save JSON report
        echo "$REPORT" > reports/test-report.json
        
        # Generate Markdown if requested
        if [ "${{ inputs.report_format }}" = "markdown" ] || [ "${{ inputs.report_format }}" = "both" ]; then
          MARKDOWN=$(echo "$REPORT" | jq -r '
            "# Salesforce Test Report\n\n" +
            "**Generated:** " + .timestamp + "\n\n" +
            "## Test Summary\n\n" +
            "| Metric | Value |\n" +
            "|--------|-------|\n" +
            "| Total Tests | " + (.summary.totalTests | tostring) + " |\n" +
            "| Passed | " + (.summary.passed | tostring) + " |\n" +
            "| Failed | " + (.summary.failed | tostring) + " |\n" +
            "| Skipped | " + (.summary.skipped | tostring) + " |\n" +
            "| Total Duration | " + (.summary.totalDuration | tostring) + "ms |\n" +
            "| Overall Coverage | " + .summary.overallCoverage + " |\n\n" +
            (if (.failingClasses | length) > 0 then
              "## ❌ Failing Test Classes\n\n" +
              "| Class Name | Last Committer | Email | Last Modified |\n" +
              "|------------|----------------|-------|---------------|\n" +
              (.failingClasses[] | "| " + .className + " | " + (.lastCommitter.name // "N/A") + " | " + (.lastCommitter.email // "N/A") + " | " + (.lastCommitter.date // "N/A") + " |\n") +
              "\n"
            else
              "## ✅ All Tests Passed\n\n"
            end) +
            (if (.lowCoverageClasses | length) > 0 then
              "## ⚠️ Classes with Coverage < " + (.metadata.coverageThreshold | tostring) + "%\n\n" +
              "| Class Name | Coverage % | Lines Covered | Total Lines |\n" +
              "|------------|------------|---------------|------------|\n" +
              (.lowCoverageClasses[] | "| " + .className + " | " + .coveragePercent + "% | " + (.linesCovered | tostring) + " | " + (.linesTotal | tostring) + " |\n") +
              "\n"
            else
              "## ✅ All Classes Meet Coverage Requirements (≥" + (.metadata.coverageThreshold | tostring) + "%)\n\n"
            end)
          ')
          echo "$MARKDOWN" > reports/test-report.md
        fi
        
        # Set outputs
        echo "report_path=reports/test-report.json" >> $GITHUB_OUTPUT
        echo "failing_classes_count=$FAILING_COUNT" >> $GITHUB_OUTPUT
        echo "low_coverage_count=$LOW_COVERAGE_COUNT" >> $GITHUB_OUTPUT
