name: 'Salesforce Authentication'
description: 'Authenticate to Salesforce org using web login'

inputs:
  username:
    description: 'Salesforce username'
    required: true
  password:
    description: 'Salesforce password'
    required: true
  security_token:
    description: 'Salesforce security token'
    required: true
  login_url:
    description: 'Salesforce login URL'
    required: false
    default: 'https://test.salesforce.com'
  alias:
    description: 'Alias for the authenticated org'
    required: false
    default: 'test-sandbox'

runs:
  using: 'composite'
  steps:
    - name: Setup Salesforce CLI
      shell: bash
      run: |
        npm install -g @salesforce/cli
        sf --version
        # Also install legacy sfdx CLI for compatibility
        npm install -g sfdx-cli || echo "sfdx-cli installation skipped (sf CLI should be sufficient)"
    
    - name: Authenticate to Salesforce
      shell: bash
      env:
        SF_USERNAME: ${{ inputs.username }}
        SF_PASSWORD: ${{ inputs.password }}
        SF_SECURITY_TOKEN: ${{ inputs.security_token }}
        SF_LOGIN_URL: ${{ inputs.login_url }}
      run: |
        # Authenticate to Salesforce using username/password with security token
        # Use sfdx auth:sfdxurl:store for non-interactive authentication
        # Format: force://PlatformCLI::BASE64_ENCODED_CREDENTIALS@INSTANCE_URL
        # Credentials format: username:password+security_token
        
        FULL_PASSWORD="${SF_PASSWORD}${SF_SECURITY_TOKEN}"
        
        # Base64 encode username:password+token (without newline)
        ENCODED_CREDS=$(echo -n "${SF_USERNAME}:${FULL_PASSWORD}" | base64 | tr -d '\n')
        
        # Build auth URL - remove https:// from login URL if present for instance URL
        INSTANCE_URL="${SF_LOGIN_URL}"
        INSTANCE_URL="${INSTANCE_URL#https://}"
        INSTANCE_URL="${INSTANCE_URL#http://}"
        
        AUTH_URL="force://PlatformCLI::${ENCODED_CREDS}@${INSTANCE_URL}"
        
        echo "Attempting authentication to: ${INSTANCE_URL}"
        
        # Create temporary file for auth URL (more reliable than stdin)
        AUTH_FILE=$(mktemp)
        echo "$AUTH_URL" > "$AUTH_FILE"
        
        # Try modern sf CLI first
        sf org login sfdx-url \
          --sfdx-url-file "$AUTH_FILE" \
          --alias ${{ inputs.alias }} 2>&1 || {
          
          # Fallback: Try legacy sfdx command
          echo "Modern sf CLI failed, trying legacy sfdx..."
          sfdx auth:sfdxurl:store \
            --sfdxurlfile "$AUTH_FILE" \
            --setalias ${{ inputs.alias }} \
            --setdefaultusername ${{ inputs.username }} 2>&1 || {
            
            # Clean up temp file
            rm -f "$AUTH_FILE"
            
            echo "Error: Authentication failed with both methods."
            echo "Debug info:"
            echo "  - Username: ${SF_USERNAME}"
            echo "  - Login URL: ${SF_LOGIN_URL}"
            echo "  - Instance URL: ${INSTANCE_URL}"
            echo "  - Auth URL format: force://PlatformCLI::[encoded]@${INSTANCE_URL}"
            echo ""
            echo "Common issues:"
            echo "  1. Security token might be incorrect"
            echo "  2. Username/password might be incorrect"
            echo "  3. IP might not be whitelisted in Salesforce"
            echo "  4. Login URL might be wrong (use https://test.salesforce.com for sandbox)"
            rm -f "$AUTH_FILE"
            exit 1
          }
        }
        
        # Clean up temp file
        rm -f "$AUTH_FILE"
        
        # Verify authentication worked
        echo "Verifying authentication..."
        sf org display --target-org ${{ inputs.alias }} || \
        sfdx force:org:display --targetusername ${{ inputs.alias }} || {
          echo "Warning: Could not verify org display, but authentication command completed"
        }
        
        # Set as default org
        sf config set target-org=${{ inputs.alias }} || \
        sf config set defaultusername=${{ inputs.alias }} || \
        echo "Note: Could not set default org, but authentication succeeded"
