# ============================================================================
# Scheduled Salesforce Test Runner
# ============================================================================
# Runs Apex tests daily at 3:00 AM IST and generates comprehensive reports
# ============================================================================

name: Scheduled Salesforce Test Runner

on:
  schedule:
    # Runs at 3:00 AM IST daily (21:30 UTC previous day)
    - cron: '30 21 * * *'
  
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test Level'
        required: true
        default: 'RunLocalTests'
        type: choice
        options:
          - RunLocalTests
          - RunAllTestsInOrg
          - RunSpecifiedTests
      specified_tests:
        description: 'Comma-separated test classes (only for RunSpecifiedTests)'
        required: false
        default: ''
      coverage_threshold:
        description: 'Coverage threshold percentage'
        required: false
        default: '95'
      commit_report:
        description: 'Commit report to repository'
        required: false
        default: true
        type: boolean

env:
  SF_ORG_ALIAS: 'TestSandbox'
  COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold || '95' }}
  REPORTS_DIR: 'test-reports'
  TEST_LEVEL: ${{ inputs.test_level || 'RunLocalTests' }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job: Execute Tests and Generate Report
  # ──────────────────────────────────────────────────────────────────────────
  run-tests:
    name: Execute Apex Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    outputs:
      has_failures: ${{ steps.analyze.outputs.has_failures }}
      has_low_coverage: ${{ steps.analyze.outputs.has_low_coverage }}
      report_date: ${{ steps.analyze.outputs.report_date }}
      report_time: ${{ steps.analyze.outputs.report_time }}
      summary_passing: ${{ steps.analyze.outputs.summary_passing }}
      summary_failing: ${{ steps.analyze.outputs.summary_failing }}
      summary_total: ${{ steps.analyze.outputs.summary_total }}
      summary_pass_rate: ${{ steps.analyze.outputs.summary_pass_rate }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Sandbox
        run: |
          echo "${{ secrets.SANDBOX_AUTH_URL }}" > auth_url.txt
          sf org login sfdx-url \
            --sfdx-url-file auth_url.txt \
            --alias ${{ env.SF_ORG_ALIAS }} \
            --set-default
          rm auth_url.txt

      - name: Verify Org Connection
        run: sf org display --target-org ${{ env.SF_ORG_ALIAS }}

      # ────────────────────────────────────────────────────────────────────
      # Run Apex Tests
      # ────────────────────────────────────────────────────────────────────
      - name: Run Apex Tests
        id: run-tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ./test-results
          
          # Validate RunSpecifiedTests has classes
          if [[ "${{ env.TEST_LEVEL }}" == "RunSpecifiedTests" && -z "${{ inputs.specified_tests }}" ]]; then
            echo "::error::No test classes specified. Provide comma-separated class names."
            exit 1
          fi
          
          # Build command
          if [[ "${{ env.TEST_LEVEL }}" == "RunSpecifiedTests" ]]; then
            echo "🧪 Running specified tests: ${{ inputs.specified_tests }}"
            sf apex run test \
              --target-org "${{ env.SF_ORG_ALIAS }}" \
              --class-names "${{ inputs.specified_tests }}" \
              --code-coverage \
              --result-format json \
              --output-dir ./test-results \
              --wait 30 || TEST_EXIT=$?
          else
            echo "🧪 Running test level: ${{ env.TEST_LEVEL }}"
            sf apex run test \
              --target-org "${{ env.SF_ORG_ALIAS }}" \
              --test-level "${{ env.TEST_LEVEL }}" \
              --code-coverage \
              --result-format json \
              --output-dir ./test-results \
              --wait 30 || TEST_EXIT=$?
          fi
          
          TEST_EXIT=${TEST_EXIT:-0}
          echo "CLI exit code: $TEST_EXIT"
          
          # Find and copy test result file
          RESULT_FILE=$(find ./test-results -name "test-result-*.json" -type f \
            ! -name "*-codecoverage.json" \
            ! -name "*-junit.xml" | head -1)
          
          if [[ -z "$RESULT_FILE" ]]; then
            echo "::error::No test result file found."
            ls -lh ./test-results/
            exit 1
          fi
          
          cp "$RESULT_FILE" ./test-results/test-results.json
          echo "✅ Test results saved"
          
          # Fail only on execution errors, not test failures
          if [[ $TEST_EXIT -ne 0 && $TEST_EXIT -ne 100 ]]; then
            echo "::error::Test execution failed with code $TEST_EXIT"
            exit $TEST_EXIT
          fi

      # ────────────────────────────────────────────────────────────────────
      # Analyze Results and Generate Report
      # ────────────────────────────────────────────────────────────────────
      - name: Analyze Results
        id: analyze
        run: |
          cat > analyze-results.js << 'ANALYZE_SCRIPT'
          const fs = require('fs');
          const { execSync } = require('child_process');
          
          // Load test results
          const rawData = JSON.parse(fs.readFileSync('./test-results/test-results.json', 'utf8'));
          
          if (Array.isArray(rawData)) {
            console.error('❌ ERROR: Invalid test results format');
            process.exit(1);
          }
          
          const testData = rawData.result || rawData;
          const summary = testData.summary || {};
          const tests = testData.tests || [];
          
          console.log(`📋 Tests: ${summary.testsRan}, Passing: ${summary.passing}, Failing: ${summary.failing}`);
          
          // Load coverage data
          let coverageData = [];
          if (testData.coverage?.coverage) {
            coverageData = testData.coverage.coverage;
          } else {
            const coverageFile = './test-results/test-result-codecoverage.json';
            if (fs.existsSync(coverageFile)) {
              const coverage = JSON.parse(fs.readFileSync(coverageFile, 'utf8'));
              coverageData = Array.isArray(coverage) ? coverage : [];
            }
          }
          
          // Parse coverage
          const threshold = parseFloat(process.env.COVERAGE_THRESHOLD || '95');
          const coverage = coverageData.map(c => ({
            className: c.name || c.apexClassOrTrigger?.name || 'Unknown',
            linesCovered: parseInt(c.totalCovered || c.numLinesCovered || 0),
            linesUncovered: parseInt(c.totalLines || 0) - parseInt(c.totalCovered || c.numLinesCovered || 0),
            totalLines: parseInt(c.totalLines || 0),
            coveragePercentage: parseInt(c.totalLines || 0) > 0 
              ? Math.round((parseInt(c.totalCovered || c.numLinesCovered || 0) / parseInt(c.totalLines || 0)) * 10000) / 100 
              : 0
          }));
          
          const lowCoverage = coverage
            .filter(c => c.coveragePercentage < threshold && c.totalLines > 0)
            .sort((a, b) => a.coveragePercentage - b.coveragePercentage);
          
          console.log(`📊 Coverage: ${coverage.length} classes, ${lowCoverage.length} below ${threshold}%`);
          
          // Parse failures
          const failuresByClass = {};
          tests.filter(t => (t.Outcome || t.outcome) === 'Fail').forEach(t => {
            const className = t.ApexClass?.Name || t.ClassName || t.apexClass?.name || 'Unknown';
            if (!failuresByClass[className]) {
              failuresByClass[className] = { className, methods: [] };
            }
            failuresByClass[className].methods.push({
              methodName: t.MethodName || t.methodName,
              message: t.Message || t.message,
              stackTrace: t.StackTrace || t.stackTrace
            });
          });
          
          // Git blame lookup
          function getLastCommitter(className) {
            const paths = [`force-app/main/default/classes/${className}.cls`, `src/classes/${className}.cls`];
            for (const p of paths) {
              if (fs.existsSync(p)) {
                try {
                  const result = execSync(`git log -1 --format="%an|%ae|%aI" -- "${p}"`, 
                    { encoding: 'utf8', timeout: 5000 }).trim();
                  if (result) {
                    const [name, email, date] = result.split('|');
                    return { name, email, date: date?.split('T')[0] };
                  }
                } catch (e) {}
              }
            }
            return null;
          }
          
          Object.values(failuresByClass).forEach(f => f.lastCommitter = getLastCommitter(f.className));
          lowCoverage.forEach(c => c.lastCommitter = getLastCommitter(c.className));
          
          // Build report
          const now = new Date();
          const reportDate = now.toISOString().split('T')[0];
          const reportTime = now.toISOString();
          
          const report = {
            summary: {
              outcome: summary.outcome || 'Unknown',
              testsRan: parseInt(summary.testsRan) || tests.length || 0,
              passing: parseInt(summary.passing) || 0,
              failing: parseInt(summary.failing) || 0,
              passRate: summary.passRate || `${Math.round((parseInt(summary.passing) / parseInt(summary.testsRan)) * 100)}%`,
              testRunId: summary.testRunId || 'N/A',
              orgWideCoverage: summary.orgWideCoverage || 'N/A',
              testRunCoverage: summary.testRunCoverage || 'N/A',
              timestamp: reportTime,
              reportDate: reportDate,
              coverageThreshold: threshold,
              lowCoverageCount: lowCoverage.length
            },
            failingClasses: Object.values(failuresByClass),
            lowCoverageClasses: lowCoverage.slice(0, 15)
          };
          
          fs.writeFileSync('./test-results/report.json', JSON.stringify(report, null, 2));
          
          // Generate Markdown Report
          const isHealthy = report.summary.failing === 0 && lowCoverage.length === 0;
          let md = `# 🧪 Salesforce Apex Test Report\n\n`;
          md += `**Generated:** ${report.summary.timestamp}\n`;
          md += `**Test Run ID:** ${report.summary.testRunId}\n\n`;
          md += `## ${isHealthy ? '✅' : '🔴'} Summary\n\n`;
          md += `| Metric | Value |\n|--------|-------|\n`;
          md += `| Tests Run | ${report.summary.testsRan} |\n`;
          md += `| Passing | ✅ ${report.summary.passing} |\n`;
          md += `| Failing | ${report.summary.failing > 0 ? '❌' : '✅'} ${report.summary.failing} |\n`;
          md += `| Pass Rate | ${report.summary.passRate} |\n`;
          md += `| Org Coverage | ${report.summary.orgWideCoverage} |\n`;
          md += `| Low Coverage Classes | ${lowCoverage.length > 0 ? '⚠️' : '✅'} ${lowCoverage.length} |\n\n`;
          
          if (report.failingClasses.length > 0) {
            md += `## ❌ Failing Test Classes\n\n`;
            report.failingClasses.forEach(f => {
              md += `### \`${f.className}\`\n`;
              if (f.lastCommitter) md += `**Last Modified:** ${f.lastCommitter.name} on ${f.lastCommitter.date}\n`;
              md += `\n**Failed Methods:**\n`;
              f.methods.forEach(m => {
                md += `- \`${m.methodName}\`\n`;
                if (m.message) md += `  - Error: ${m.message.substring(0, 150)}\n`;
              });
              md += `\n`;
            });
          }
          
          if (lowCoverage.length > 0) {
            md += `## 📉 Low Coverage Classes (Below ${threshold}%)\n\n`;
            md += `| Class | Coverage | Lines |\n|-------|----------|-------|\n`;
            lowCoverage.slice(0, 15).forEach(c => {
              const icon = c.coveragePercentage < 50 ? '🔴' : '⚠️';
              md += `| \`${c.className}\` | ${icon} ${c.coveragePercentage.toFixed(1)}% | ${c.linesCovered}/${c.totalLines} |\n`;
            });
            if (lowCoverage.length > 15) md += `\n_... and ${lowCoverage.length - 15} more_\n`;
          }
          
          fs.writeFileSync('./test-results/report.md', md);
          
          // Generate HTML Report
          const statusColor = isHealthy ? '#28a745' : '#dc3545';
          let html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
  h1 { color: ${statusColor}; }
  table { width: 100%; border-collapse: collapse; margin: 20px 0; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
  th { background: #f5f5f5; }
  .success { color: #28a745; }
  .failure { color: #dc3545; }
  .warning { color: #ffc107; }
</style></head><body>
<h1>${isHealthy ? '✅' : '🔴'} Salesforce Test Report</h1>
<p><strong>Generated:</strong> ${report.summary.timestamp}</p>
<h2>Summary</h2>
<table>
  <tr><th>Metric</th><th>Value</th></tr>
  <tr><td>Tests Run</td><td>${report.summary.testsRan}</td></tr>
  <tr><td>Passing</td><td class="success">${report.summary.passing}</td></tr>
  <tr><td>Failing</td><td class="${report.summary.failing > 0 ? 'failure' : 'success'}">${report.summary.failing}</td></tr>
  <tr><td>Pass Rate</td><td>${report.summary.passRate}</td></tr>
  <tr><td>Org Coverage</td><td>${report.summary.orgWideCoverage}</td></tr>
</table>`;
          
          if (report.failingClasses.length > 0) {
            html += '<h2>❌ Failing Classes</h2>';
            report.failingClasses.forEach(f => {
              html += `<h3>${f.className}</h3><ul>`;
              f.methods.forEach(m => {
                html += `<li>${m.methodName}</li>`;
              });
              html += '</ul>';
            });
          }
          
          if (lowCoverage.length > 0) {
            html += `<h2>📉 Low Coverage (Below ${threshold}%)</h2><table>
<tr><th>Class</th><th>Coverage</th></tr>`;
            lowCoverage.slice(0, 10).forEach(c => {
              html += `<tr><td>${c.className}</td><td class="warning">${c.coveragePercentage.toFixed(1)}%</td></tr>`;
            });
            html += '</table>';
          }
          
          html += '</body></html>';
          fs.writeFileSync('./test-results/report.html', html);
          
          // Set outputs
          const outputFile = process.env.GITHUB_OUTPUT;
          if (outputFile) {
            fs.appendFileSync(outputFile, `has_failures=${report.summary.failing > 0}\n`);
            fs.appendFileSync(outputFile, `has_low_coverage=${lowCoverage.length > 0}\n`);
            fs.appendFileSync(outputFile, `report_date=${reportDate}\n`);
            fs.appendFileSync(outputFile, `report_time=${reportTime}\n`);
            fs.appendFileSync(outputFile, `summary_passing=${report.summary.passing}\n`);
            fs.appendFileSync(outputFile, `summary_failing=${report.summary.failing}\n`);
            fs.appendFileSync(outputFile, `summary_total=${report.summary.testsRan}\n`);
            fs.appendFileSync(outputFile, `summary_pass_rate=${report.summary.passRate}\n`);
          }
          
          console.log(`✅ Report: ${report.summary.failing} failures, ${lowCoverage.length} low coverage`);
          ANALYZE_SCRIPT
          
          node analyze-results.js

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.analyze.outputs.report_date }}
          path: ./test-results/
          retention-days: 30

      - name: Post Summary to GitHub
        if: always()
        run: |
          if [ -f ./test-results/report.md ]; then
            cat ./test-results/report.md >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Job: Commit Report to Repository
  # ──────────────────────────────────────────────────────────────────────────
  commit-report:
    name: Commit Test Report
    runs-on: ubuntu-latest
    needs: run-tests
    # FIX 1: Proper boolean handling - inputs.commit_report is boolean, not string
    # For scheduled runs, inputs.commit_report is null, so we default to true
    if: ${{ always() && (github.event_name == 'schedule' || inputs.commit_report == true) }}
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Report
        uses: actions/download-artifact@v4
        with:
          name: test-results-${{ needs.run-tests.outputs.report_date }}
          path: ./test-results/

      - name: Organize Reports Directory
        shell: bash
        run: |
          # Create directory structure
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          REPORT_DIR="${{ env.REPORTS_DIR }}/${YEAR}/${MONTH}"
          TIMESTAMP="${{ needs.run-tests.outputs.report_date }}"
          REPORT_SUBDIR="${REPORT_DIR}/${TIMESTAMP}"
          
          mkdir -p "${REPORT_SUBDIR}"
          
          # FIX 2: Explicit bash shell ensures brace expansion works
          cp ./test-results/*.json "${REPORT_SUBDIR}/" 2>/dev/null || true
          cp ./test-results/*.md "${REPORT_SUBDIR}/" 2>/dev/null || true
          cp ./test-results/*.html "${REPORT_SUBDIR}/" 2>/dev/null || true
          
          # Update month index
          INDEX_FILE="${REPORT_DIR}/README.md"
          if [ ! -f "${INDEX_FILE}" ]; then
            echo -e "# Test Reports - ${MONTH}/${YEAR}\n\n## Reports\n" > "${INDEX_FILE}"
          fi
          
          # FIX 3: Proper numeric comparison - convert string output to number
          FAILING_COUNT="${{ needs.run-tests.outputs.summary_failing }}"
          if [ "${FAILING_COUNT:-0}" -gt 0 ]; then
            STATUS="🔴"
          else
            STATUS="✅"
          fi
          
          REPORT_LINE="- ${STATUS} [${TIMESTAMP}](./${TIMESTAMP}/report.md) - ${{ needs.run-tests.outputs.summary_total }} tests, ${{ needs.run-tests.outputs.summary_failing }} failures"
          
          # Insert new report at the top of the reports list
          {
            head -n 4 "${INDEX_FILE}"
            echo "${REPORT_LINE}"
            tail -n +5 "${INDEX_FILE}"
          } > "${INDEX_FILE}.tmp" && mv "${INDEX_FILE}.tmp" "${INDEX_FILE}"
          
          echo "REPORT_DIR=${REPORT_DIR}" >> $GITHUB_ENV
          echo "REPORT_SUBDIR=${REPORT_SUBDIR}" >> $GITHUB_ENV

      - name: Create Root Index
        shell: bash
        run: |
          ROOT_INDEX="${{ env.REPORTS_DIR }}/README.md"
          
          cat > "${ROOT_INDEX}" << 'EOF'
          # Salesforce Test Reports

          Automated test execution reports organized by year and month.

          ## Latest Reports

          EOF
          
          # List 10 most recent reports
          find "${{ env.REPORTS_DIR }}" -name "report.md" -type f -print0 2>/dev/null | \
            xargs -0 ls -t 2>/dev/null | head -10 | while read -r filepath; do
            REPORT_DATE=$(echo "$filepath" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
            if [ -n "$REPORT_DATE" ]; then
              REL_PATH="${filepath#${{ env.REPORTS_DIR }}/}"
              echo "- [${REPORT_DATE}](./${REL_PATH})" >> "${ROOT_INDEX}"
            fi
          done
          
          cat >> "${ROOT_INDEX}" << 'EOF'

          ## Directory Structure

          - `YYYY/MM/YYYY-MM-DD/` - Daily reports
          - Each report includes: `report.json`, `report.md`, `report.html`

          EOF

      - name: Commit and Push Reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.REPORTS_DIR }}/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # FIX 4: Proper numeric comparison in shell
          FAILING_COUNT="${{ needs.run-tests.outputs.summary_failing }}"
          if [ "${FAILING_COUNT:-0}" -gt 0 ]; then
            STATUS="🔴"
          else
            STATUS="✅"
          fi
          
          git commit -m "test: ${STATUS} Test report ${{ needs.run-tests.outputs.report_date }}

          Tests: ${{ needs.run-tests.outputs.summary_total }}
          Passing: ${{ needs.run-tests.outputs.summary_passing }}
          Failing: ${{ needs.run-tests.outputs.summary_failing }}
          Pass Rate: ${{ needs.run-tests.outputs.summary_pass_rate }}"
          
          git push
          echo "✅ Report committed"