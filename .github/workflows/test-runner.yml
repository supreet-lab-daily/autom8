# Scheduled Salesforce Test Runner
# Runs Apex tests daily at 3:00 AM IST and generates reports

name: Scheduled Salesforce Test Runner

on:
  schedule:
    # 3:00 AM IST daily (21:30 UTC previous day)
    - cron: '30 21 * * *'
  
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test Level'
        required: true
        default: 'RunLocalTests'
        type: choice
        options:
          - RunLocalTests
          - RunAllTestsInOrg
          - RunSpecifiedTests
      specified_tests:
        description: 'Comma-separated test classes (only for RunSpecifiedTests)'
        required: false
        default: ''
      coverage_threshold:
        description: 'Coverage threshold percentage'
        required: false
        default: '95'
      commit_report:
        description: 'Commit report to repository'
        required: false
        default: true
        type: boolean

env:
  SF_ORG_ALIAS: 'TestSandbox'
  COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold || '95' }}
  REPORTS_DIR: 'test-reports'
  TEST_LEVEL: ${{ inputs.test_level || 'RunLocalTests' }}

jobs:
  run-tests:
    name: Execute Apex Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    outputs:
      has_failures: ${{ steps.analyze.outputs.has_failures }}
      has_low_coverage: ${{ steps.analyze.outputs.has_low_coverage }}
      report_date: ${{ steps.analyze.outputs.report_date }}
      summary_passing: ${{ steps.analyze.outputs.summary_passing }}
      summary_failing: ${{ steps.analyze.outputs.summary_failing }}
      summary_total: ${{ steps.analyze.outputs.summary_total }}
      summary_pass_rate: ${{ steps.analyze.outputs.summary_pass_rate }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Sandbox
        run: |
          echo "${{ secrets.SANDBOX_AUTH_URL }}" > auth_url.txt
          sf org login sfdx-url \
            --sfdx-url-file auth_url.txt \
            --alias ${{ env.SF_ORG_ALIAS }} \
            --set-default
          rm auth_url.txt

      - name: Verify Org Connection
        run: sf org display --target-org ${{ env.SF_ORG_ALIAS }}

      - name: Run Apex Tests
        id: run-tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ./test-results
          
          TEST_LEVEL="${{ env.TEST_LEVEL }}"
          SPECIFIED_TESTS="${{ inputs.specified_tests }}"
          
          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" && -z "$SPECIFIED_TESTS" ]]; then
            echo "::error::No test classes specified for RunSpecifiedTests"
            exit 1
          fi
          
          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" ]]; then
            echo "🧪 Running specified tests: $SPECIFIED_TESTS"
            sf apex run test \
              --target-org "${{ env.SF_ORG_ALIAS }}" \
              --class-names "$SPECIFIED_TESTS" \
              --code-coverage \
              --result-format json \
              --output-dir ./test-results \
              --wait 30 || TEST_EXIT=$?
          else
            echo "🧪 Running test level: $TEST_LEVEL"
            sf apex run test \
              --target-org "${{ env.SF_ORG_ALIAS }}" \
              --test-level "$TEST_LEVEL" \
              --code-coverage \
              --result-format json \
              --output-dir ./test-results \
              --wait 30 || TEST_EXIT=$?
          fi
          
          TEST_EXIT=${TEST_EXIT:-0}
          
          RESULT_FILE=$(find ./test-results -name "test-result-*.json" -type f \
            ! -name "*-codecoverage.json" ! -name "*-junit.xml" | head -1)
          
          if [[ -z "$RESULT_FILE" ]]; then
            echo "::error::No test result file found"
            exit 1
          fi
          
          cp "$RESULT_FILE" ./test-results/test-results.json
          
          # Fail only on execution errors, not test failures (exit 100)
          if [[ $TEST_EXIT -ne 0 && $TEST_EXIT -ne 100 ]]; then
            exit $TEST_EXIT
          fi

      - name: Analyze Results
        id: analyze
        env:
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');
          
          const rawData = JSON.parse(fs.readFileSync('./test-results/test-results.json', 'utf8'));
          if (Array.isArray(rawData)) {
            console.error('Invalid test results format');
            process.exit(1);
          }
          
          const testData = rawData.result || rawData;
          const summary = testData.summary || {};
          const tests = testData.tests || [];
          const threshold = parseFloat(process.env.COVERAGE_THRESHOLD || '95');
          
          // Load coverage data
          let coverageData = testData.coverage?.coverage || [];
          if (!coverageData.length) {
            const coverageFile = './test-results/test-result-codecoverage.json';
            if (fs.existsSync(coverageFile)) {
              const data = JSON.parse(fs.readFileSync(coverageFile, 'utf8'));
              coverageData = Array.isArray(data) ? data : [];
            }
          }
          
          // Parse coverage
          const coverage = coverageData.map(c => {
            const covered = parseInt(c.totalCovered || c.numLinesCovered || 0);
            const total = parseInt(c.totalLines || 0);
            return {
              className: c.name || c.apexClassOrTrigger?.name || 'Unknown',
              linesCovered: covered,
              totalLines: total,
              coveragePercentage: total > 0 ? Math.round((covered / total) * 10000) / 100 : 0
            };
          });
          
          const lowCoverage = coverage
            .filter(c => c.coveragePercentage < threshold && c.totalLines > 0)
            .sort((a, b) => a.coveragePercentage - b.coveragePercentage);
          
          // Parse failures
          const failuresByClass = {};
          tests.filter(t => (t.Outcome || t.outcome) === 'Fail').forEach(t => {
            const className = t.ApexClass?.Name || t.ClassName || t.apexClass?.name || 'Unknown';
            if (!failuresByClass[className]) failuresByClass[className] = { className, methods: [] };
            failuresByClass[className].methods.push({
              methodName: t.MethodName || t.methodName,
              message: t.Message || t.message
            });
          });
          
          // Git blame
          function getLastCommitter(className) {
            const paths = [`force-app/main/default/classes/${className}.cls`, `src/classes/${className}.cls`];
            for (const p of paths) {
              if (fs.existsSync(p)) {
                try {
                  const result = execSync(`git log -1 --format="%an|%aI" -- "${p}"`, { encoding: 'utf8', timeout: 5000 }).trim();
                  if (result) {
                    const [name, date] = result.split('|');
                    return { name, date: date?.split('T')[0] };
                  }
                } catch (e) {}
              }
            }
            return null;
          }
          
          Object.values(failuresByClass).forEach(f => f.lastCommitter = getLastCommitter(f.className));
          lowCoverage.forEach(c => c.lastCommitter = getLastCommitter(c.className));
          
          // Build report
          const now = new Date();
          const reportDate = now.toISOString().split('T')[0];
          
          const report = {
            summary: {
              testsRan: parseInt(summary.testsRan) || tests.length || 0,
              passing: parseInt(summary.passing) || 0,
              failing: parseInt(summary.failing) || 0,
              passRate: summary.passRate || '0%',
              testRunId: summary.testRunId || 'N/A',
              orgWideCoverage: summary.orgWideCoverage || 'N/A',
              timestamp: now.toISOString(),
              reportDate
            },
            failingClasses: Object.values(failuresByClass),
            lowCoverageClasses: lowCoverage.slice(0, 15)
          };
          
          fs.writeFileSync('./test-results/report.json', JSON.stringify(report, null, 2));
          
          // Generate Markdown
          const isHealthy = report.summary.failing === 0 && lowCoverage.length === 0;
          let md = '# 🧪 Apex Test Report\n\n';
          md += '**Date:** ' + report.summary.timestamp + '  \n**Test Run ID:** ' + report.summary.testRunId + '\n\n';
          md += '## ' + (isHealthy ? '✅' : '🔴') + ' Summary\n\n';
          md += '| Metric | Value |\n|--------|-------|\n';
          md += '| Tests Run | ' + report.summary.testsRan + ' |\n';
          md += '| Passing | ✅ ' + report.summary.passing + ' |\n';
          md += '| Failing | ' + (report.summary.failing > 0 ? '❌' : '✅') + ' ' + report.summary.failing + ' |\n';
          md += '| Pass Rate | ' + report.summary.passRate + ' |\n';
          md += '| Org Coverage | ' + report.summary.orgWideCoverage + ' |\n\n';
          
          if (report.failingClasses.length > 0) {
            md += '## ❌ Failing Tests\n\n';
            report.failingClasses.forEach(f => {
              md += '### `' + f.className + '`\n';
              if (f.lastCommitter) md += 'Last modified by ' + f.lastCommitter.name + ' on ' + f.lastCommitter.date + '\n\n';
              f.methods.forEach(m => {
                md += '- `' + m.methodName + '`' + (m.message ? ': ' + m.message.substring(0, 100) : '') + '\n';
              });
              md += '\n';
            });
          }
          
          if (lowCoverage.length > 0) {
            md += '## 📉 Low Coverage (< ' + threshold + '%)\n\n';
            md += '| Class | Coverage | Lines |\n|-------|----------|-------|\n';
            lowCoverage.slice(0, 15).forEach(c => {
              md += '| `' + c.className + '` | ' + c.coveragePercentage.toFixed(1) + '% | ' + c.linesCovered + '/' + c.totalLines + ' |\n';
            });
          }
          
          fs.writeFileSync('./test-results/report.md', md);
          
          // Generate HTML
          let html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>';
          html += 'body{font-family:Arial,sans-serif;max-width:800px;margin:20px auto;padding:20px}';
          html += 'table{width:100%;border-collapse:collapse;margin:20px 0}';
          html += 'th,td{padding:10px;text-align:left;border-bottom:1px solid #ddd}';
          html += 'th{background:#f5f5f5}.pass{color:#28a745}.fail{color:#dc3545}';
          html += '</style></head><body>';
          html += '<h1>' + (isHealthy ? '✅' : '🔴') + ' Apex Test Report</h1>';
          html += '<p><strong>Date:</strong> ' + report.summary.timestamp + '</p>';
          html += '<table><tr><th>Metric</th><th>Value</th></tr>';
          html += '<tr><td>Tests Run</td><td>' + report.summary.testsRan + '</td></tr>';
          html += '<tr><td>Passing</td><td class="pass">' + report.summary.passing + '</td></tr>';
          html += '<tr><td>Failing</td><td class="' + (report.summary.failing > 0 ? 'fail' : 'pass') + '">' + report.summary.failing + '</td></tr>';
          html += '<tr><td>Pass Rate</td><td>' + report.summary.passRate + '</td></tr>';
          html += '</table></body></html>';
          
          fs.writeFileSync('./test-results/report.html', html);
          
          // Set outputs
          const out = process.env.GITHUB_OUTPUT;
          if (out) {
            fs.appendFileSync(out, 'has_failures=' + (report.summary.failing > 0) + '\n');
            fs.appendFileSync(out, 'has_low_coverage=' + (lowCoverage.length > 0) + '\n');
            fs.appendFileSync(out, 'report_date=' + reportDate + '\n');
            fs.appendFileSync(out, 'summary_passing=' + report.summary.passing + '\n');
            fs.appendFileSync(out, 'summary_failing=' + report.summary.failing + '\n');
            fs.appendFileSync(out, 'summary_total=' + report.summary.testsRan + '\n');
            fs.appendFileSync(out, 'summary_pass_rate=' + report.summary.passRate + '\n');
          }
          
          console.log('✅ Report generated:', report.summary.failing, 'failures,', lowCoverage.length, 'low coverage');
          EOF

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.analyze.outputs.report_date }}
          path: ./test-results/
          retention-days: 30

      - name: Post Summary
        if: always()
        run: |
          if [ -f ./test-results/report.md ]; then
            cat ./test-results/report.md >> $GITHUB_STEP_SUMMARY
          fi

  commit-report:
    name: Commit Test Report
    runs-on: ubuntu-latest
    needs: run-tests
    if: ${{ always() && (github.event_name == 'schedule' || inputs.commit_report == true) }}
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Report
        uses: actions/download-artifact@v4
        with:
          name: test-results-${{ needs.run-tests.outputs.report_date }}
          path: ./test-results/

      - name: Organize and Commit Reports
        shell: bash
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          REPORT_DIR="${{ env.REPORTS_DIR }}/${YEAR}/${MONTH}"
          TIMESTAMP="${{ needs.run-tests.outputs.report_date }}"
          REPORT_SUBDIR="${REPORT_DIR}/${TIMESTAMP}"
          
          mkdir -p "${REPORT_SUBDIR}"
          cp ./test-results/report.json "${REPORT_SUBDIR}/"
          cp ./test-results/report.md "${REPORT_SUBDIR}/"
          cp ./test-results/report.html "${REPORT_SUBDIR}/"
          
          # Update month index
          INDEX_FILE="${REPORT_DIR}/README.md"
          if [ ! -f "${INDEX_FILE}" ]; then
            echo -e "# Test Reports - ${MONTH}/${YEAR}\n\n## Reports\n" > "${INDEX_FILE}"
          fi
          
          FAILING="${{ needs.run-tests.outputs.summary_failing }}"
          if [ "${FAILING:-0}" -gt 0 ]; then
            STATUS="🔴"
          else
            STATUS="✅"
          fi
          
          REPORT_LINE="- ${STATUS} [${TIMESTAMP}](./${TIMESTAMP}/report.md) - ${{ needs.run-tests.outputs.summary_total }} tests, ${{ needs.run-tests.outputs.summary_failing }} failures"
          
          {
            head -n 4 "${INDEX_FILE}"
            echo "${REPORT_LINE}"
            tail -n +5 "${INDEX_FILE}"
          } > "${INDEX_FILE}.tmp" && mv "${INDEX_FILE}.tmp" "${INDEX_FILE}"
          
          # Create root index
          ROOT_INDEX="${{ env.REPORTS_DIR }}/README.md"
          echo "# Salesforce Test Reports" > "${ROOT_INDEX}"
          echo "" >> "${ROOT_INDEX}"
          echo "## Latest Reports" >> "${ROOT_INDEX}"
          echo "" >> "${ROOT_INDEX}"
          
          find "${{ env.REPORTS_DIR }}" -name "report.md" -type f -print0 2>/dev/null | \
            xargs -0 ls -t 2>/dev/null | head -10 | while read -r filepath; do
            REPORT_DATE=$(echo "$filepath" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
            if [ -n "$REPORT_DATE" ]; then
              REL_PATH="${filepath#${{ env.REPORTS_DIR }}/}"
              echo "- [${REPORT_DATE}](./${REL_PATH})" >> "${ROOT_INDEX}"
            fi
          done
          
          # Commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.REPORTS_DIR }}/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "test: ${STATUS} Report ${TIMESTAMP} - ${{ needs.run-tests.outputs.summary_total }} tests, ${{ needs.run-tests.outputs.summary_failing }} failures"
          git push
          echo "✅ Report committed"