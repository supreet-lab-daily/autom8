# ============================================================================
# Scheduled Salesforce Test Runner
# ============================================================================
# Runs Apex tests on a schedule and generates comprehensive reports including:
# - Test pass/fail summary
# - Coverage analysis (flags classes below threshold)
# - Last committer attribution for failing/low-coverage classes
# ============================================================================

name: Scheduled Salesforce Test Runner

on:
  schedule:
    # Runs at 6 AM UTC Monday-Friday
    - cron: '0 6 * * 1-5'
  
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test Level'
        required: true
        default: 'RunSpecifiedTests'
        type: choice
        options:
          - RunSpecifiedTests
          - RunLocalTests
          - RunAllTestsInOrg
      specified_tests:
        description: 'Comma-separated test classes (only for RunSpecifiedTests)'
        required: false
        default: ''
      coverage_threshold:
        description: 'Coverage threshold percentage'
        required: false
        default: '95'
      notify_slack:
        description: 'Send Slack notification'
        required: false
        default: true
        type: boolean
      upload_confluence:
        description: 'Upload report to Confluence'
        required: false
        default: true
        type: boolean

env:
  SF_ORG_ALIAS: 'TestSandbox'
  COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold || '95' }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job: Execute Tests and Generate Report
  # ──────────────────────────────────────────────────────────────────────────
  run-tests:
    name: Execute Apex Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    outputs:
      has_failures: ${{ steps.analyze.outputs.has_failures }}
      has_low_coverage: ${{ steps.analyze.outputs.has_low_coverage }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Sandbox
        run: |
          echo "${{ secrets.SANDBOX_AUTH_URL }}" > auth_url.txt
          sf org login sfdx-url \
            --sfdx-url-file auth_url.txt \
            --alias ${{ env.SF_ORG_ALIAS }} \
            --set-default
          rm auth_url.txt

      - name: Verify Org Connection
        run: sf org display --target-org ${{ env.SF_ORG_ALIAS }}

      # ────────────────────────────────────────────────────────────────────
      # Run Apex Tests (Simplified)
      # ────────────────────────────────────────────────────────────────────
      - name: Run Apex Tests
        id: run-tests
        run: |
          set -o pipefail
          mkdir -p ./test-results
          
          TEST_LEVEL="${{ inputs.test_level || 'RunSpecifiedTests' }}"
          SPECIFIED_TESTS="${{ inputs.specified_tests }}"
          
          # Validate RunSpecifiedTests has classes
          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" && -z "$SPECIFIED_TESTS" ]]; then
            echo "::error::No test classes specified. Provide comma-separated class names."
            exit 1
          fi
          
          # Build command arguments
          ARGS=(
            --target-org "${{ env.SF_ORG_ALIAS }}"
            --code-coverage
            --result-format json
            --output-dir ./test-results
            --wait 30
          )
          
          # Add test level or specific classes
          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" ]]; then
            ARGS+=(--class-names "$SPECIFIED_TESTS")
            echo "🧪 Running specified tests: $SPECIFIED_TESTS"
          else
            ARGS+=(--test-level "$TEST_LEVEL")
            echo "🧪 Running test level: $TEST_LEVEL"
          fi
          
          # Execute tests
          # Exit code 100 = tests ran but some failed (expected)
          # Exit code 0 = all tests passed
          # Other codes = execution error
          echo "::group::Test Execution Output"
          sf apex run test "${ARGS[@]}" || TEST_EXIT=$?
          echo "::endgroup::"
          
          TEST_EXIT=${TEST_EXIT:-0}
          echo "CLI exit code: $TEST_EXIT"
          
          # Find the result file (SF CLI names it test-result-<id>.json)
          RESULT_FILE=$(find ./test-results -name "test-result-*.json" -type f | head -1)
          
          if [[ -z "$RESULT_FILE" ]]; then
            echo "::error::No test result file found. Execution may have failed."
            exit 1
          fi
          
          # Copy to consistent filename for downstream steps
          cp "$RESULT_FILE" ./test-results/test-results.json
          echo "✅ Test results saved to ./test-results/test-results.json"
          
          # Debug: Show the structure of the result file
          echo "::group::Result File Structure (first 100 lines)"
          head -100 ./test-results/test-results.json
          echo "::endgroup::"
          
          # Quick summary from results
          node -e "
            const raw = require('./test-results/test-results.json');
            const r = raw.result || raw;
            const s = r.summary || {};
            const tests = r.tests || [];
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.log('📊 Quick Summary');
            console.log('   Has result wrapper: ' + !!raw.result);
            console.log('   Tests in array: ' + tests.length);
            console.log('   Summary.testsRan: ' + (s.testsRan || 'N/A'));
            console.log('   Summary.passing: ' + (s.passing || 'N/A'));
            console.log('   Summary.failing: ' + (s.failing || 'N/A'));
            console.log('   Outcome: ' + (s.outcome || 'Unknown'));
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
          "
          
          # Fail only on execution errors, not test failures
          if [[ $TEST_EXIT -ne 0 && $TEST_EXIT -ne 100 ]]; then
            echo "::error::Test execution failed with code $TEST_EXIT"
            exit $TEST_EXIT
          fi

      # ────────────────────────────────────────────────────────────────────
      # Fetch Coverage Data
      # ────────────────────────────────────────────────────────────────────
      - name: Fetch Coverage Data
        run: |
          sf data query \
            --target-org ${{ env.SF_ORG_ALIAS }} \
            --query "SELECT ApexClassOrTrigger.Name, NumLinesCovered, NumLinesUncovered FROM ApexCodeCoverageAggregate ORDER BY ApexClassOrTrigger.Name" \
            --result-format json \
            > ./test-results/coverage-aggregate.json 2>/dev/null || echo '{"result":{"records":[]}}' > ./test-results/coverage-aggregate.json

      # ────────────────────────────────────────────────────────────────────
      # Analyze Results and Generate Report
      # ────────────────────────────────────────────────────────────────────
      - name: Analyze Results
        id: analyze
        run: |
          node << 'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');
          
          // ── Load test results ──
          const rawData = JSON.parse(fs.readFileSync('./test-results/test-results.json', 'utf8'));
          
          // Handle both SF CLI output structures:
          // 1. Direct: { summary: {...}, tests: [...] }
          // 2. Wrapped: { status: 0, result: { summary: {...}, tests: [...] } }
          const testData = rawData.result || rawData;
          const summary = testData.summary || {};
          const tests = testData.tests || [];
          
          // Debug: Log what we found
          console.log('📋 Parsed test data structure:');
          console.log('   Has result wrapper:', !!rawData.result);
          console.log('   Summary keys:', Object.keys(summary).join(', ') || 'none');
          console.log('   Tests count:', tests.length);
          
          // ── Load coverage data ──
          let coverageRecords = [];
          try {
            const coverageData = JSON.parse(fs.readFileSync('./test-results/coverage-aggregate.json', 'utf8'));
            coverageRecords = coverageData.result?.records || [];
          } catch (e) {
            console.warn('⚠️ Could not load coverage data');
          }
          
          // ── Parse coverage ──
          const threshold = parseFloat(process.env.COVERAGE_THRESHOLD || '95');
          const coverage = coverageRecords.map(r => {
            const covered = parseInt(r.NumLinesCovered) || 0;
            const uncovered = parseInt(r.NumLinesUncovered) || 0;
            const total = covered + uncovered;
            return {
              className: r.ApexClassOrTrigger?.Name || 'Unknown',
              linesCovered: covered,
              linesUncovered: uncovered,
              totalLines: total,
              coveragePercentage: total > 0 ? Math.round((covered / total) * 10000) / 100 : 0
            };
          });
          
          const lowCoverage = coverage
            .filter(c => c.coveragePercentage < threshold && c.totalLines > 0)
            .sort((a, b) => a.coveragePercentage - b.coveragePercentage);
          
          // ── Parse failures and group by class ──
          const failuresByClass = {};
          tests
            .filter(t => (t.Outcome || t.outcome) === 'Fail')
            .forEach(t => {
              const className = t.ApexClass?.Name || t.ClassName || t.apexClass?.name || 'Unknown';
              if (!failuresByClass[className]) {
                failuresByClass[className] = { className, methods: [] };
              }
              failuresByClass[className].methods.push({
                methodName: t.MethodName || t.methodName,
                message: t.Message || t.message,
                stackTrace: t.StackTrace || t.stackTrace
              });
            });
          
          // ── Git blame lookup ──
          function getLastCommitter(className) {
            const paths = [
              `force-app/main/default/classes/${className}.cls`,
              `src/classes/${className}.cls`
            ];
            for (const p of paths) {
              if (fs.existsSync(p)) {
                try {
                  const result = execSync(`git log -1 --format="%an|%ae|%aI" -- "${p}"`, { encoding: 'utf8', timeout: 5000 }).trim();
                  if (result) {
                    const [name, email, date] = result.split('|');
                    return { name, email, date: date?.split('T')[0] };
                  }
                } catch (e) {}
              }
            }
            return null;
          }
          
          // Add committer info
          Object.values(failuresByClass).forEach(f => f.lastCommitter = getLastCommitter(f.className));
          lowCoverage.forEach(c => c.lastCommitter = getLastCommitter(c.className));
          
          // ── Build report ──
          const report = {
            summary: {
              outcome: summary.outcome || 'Unknown',
              testsRan: parseInt(summary.testsRan) || tests.length || 0,
              passing: parseInt(summary.passing) || tests.filter(t => (t.Outcome || t.outcome) === 'Pass').length || 0,
              failing: parseInt(summary.failing) || tests.filter(t => (t.Outcome || t.outcome) === 'Fail').length || 0,
              passRate: summary.passRate || '0%',
              testRunId: summary.testRunId || 'N/A',
              timestamp: new Date().toISOString(),
              coverageThreshold: threshold,
              lowCoverageCount: lowCoverage.length
            },
            failingClasses: Object.values(failuresByClass),
            lowCoverageClasses: lowCoverage.slice(0, 15)
          };
          
          fs.writeFileSync('./test-results/report.json', JSON.stringify(report, null, 2));
          
          // ── Generate Markdown ──
          const isHealthy = report.summary.failing === 0 && lowCoverage.length === 0;
          let md = `# 🧪 Apex Test Report\n\n`;
          md += `**Generated:** ${report.summary.timestamp}\n\n`;
          md += `## ${isHealthy ? '✅' : '🔴'} Summary\n\n`;
          md += `| Metric | Value |\n|--------|-------|\n`;
          md += `| Tests Run | ${report.summary.testsRan} |\n`;
          md += `| Passing | ${report.summary.passing} |\n`;
          md += `| Failing | ${report.summary.failing} |\n`;
          md += `| Pass Rate | ${report.summary.passRate} |\n`;
          md += `| Classes Below ${threshold}% | ${lowCoverage.length} |\n\n`;
          
          if (report.failingClasses.length > 0) {
            md += `## ❌ Failing Test Classes\n\n`;
            report.failingClasses.forEach(f => {
              md += `### \`${f.className}\`\n`;
              if (f.lastCommitter) md += `**Last Committer:** ${f.lastCommitter.name} (${f.lastCommitter.email}) on ${f.lastCommitter.date}\n\n`;
              md += `**Failed Methods:**\n`;
              f.methods.forEach(m => md += `- \`${m.methodName}\`${m.message ? ': ' + m.message.substring(0, 100) : ''}\n`);
              md += `\n`;
            });
          }
          
          if (lowCoverage.length > 0) {
            md += `## 📉 Classes Below ${threshold}% Coverage\n\n`;
            md += `| Class | Coverage | Last Committer |\n|-------|----------|----------------|\n`;
            lowCoverage.slice(0, 15).forEach(c => {
              md += `| \`${c.className}\` | ${c.coveragePercentage.toFixed(1)}% | ${c.lastCommitter?.name || 'Unknown'} |\n`;
            });
          }
          
          fs.writeFileSync('./test-results/report.md', md);
          
          // ── Generate Slack payload ──
          const blocks = [
            { type: 'header', text: { type: 'plain_text', text: isHealthy ? '✅ Apex Tests Passed' : '🔴 Apex Test Issues Detected', emoji: true } },
            { type: 'section', fields: [
              { type: 'mrkdwn', text: `*Tests Run:*\n${report.summary.testsRan}` },
              { type: 'mrkdwn', text: `*Pass Rate:*\n${report.summary.passRate}` },
              { type: 'mrkdwn', text: `*Failures:*\n${report.summary.failing}` },
              { type: 'mrkdwn', text: `*Low Coverage:*\n${lowCoverage.length} classes` }
            ]},
            { type: 'divider' }
          ];
          
          if (report.failingClasses.length > 0) {
            blocks.push({ type: 'section', text: { type: 'mrkdwn', text: `*❌ Failing Classes (${report.failingClasses.length})*` } });
            report.failingClasses.slice(0, 5).forEach(f => {
              const committer = f.lastCommitter ? ` (${f.lastCommitter.name})` : '';
              const methods = f.methods.map(m => m.methodName).slice(0, 3).join(', ');
              blocks.push({ type: 'section', text: { type: 'mrkdwn', text: `• \`${f.className}\`${committer}\n  _Methods:_ ${methods}` } });
            });
            blocks.push({ type: 'divider' });
          }
          
          if (lowCoverage.length > 0) {
            blocks.push({ type: 'section', text: { type: 'mrkdwn', text: `*📉 Low Coverage (${lowCoverage.length} below ${threshold}%)*` } });
            blocks.push({ type: 'section', text: { type: 'mrkdwn', text: lowCoverage.slice(0, 5).map(c => `• \`${c.className}\` - ${c.coveragePercentage.toFixed(1)}%`).join('\n') } });
          }
          
          blocks.push({ type: 'context', elements: [{ type: 'mrkdwn', text: `🕐 ${new Date().toISOString()}` }] });
          fs.writeFileSync('./test-results/slack-payload.json', JSON.stringify({ blocks }, null, 2));
          
          // ── Set outputs ──
          const outputFile = process.env.GITHUB_OUTPUT;
          if (outputFile) {
            fs.appendFileSync(outputFile, `has_failures=${report.summary.failing > 0}\n`);
            fs.appendFileSync(outputFile, `has_low_coverage=${lowCoverage.length > 0}\n`);
          }
          
          console.log(`\n✅ Report generated — Failures: ${report.summary.failing}, Low coverage: ${lowCoverage.length}`);
          EOF

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/
          retention-days: 30

      - name: Post Summary to GitHub
        if: always()
        run: |
          if [ -f ./test-results/report.md ]; then
            cat ./test-results/report.md >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📎 [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────
  # Job: Send Slack Notification
  # ──────────────────────────────────────────────────────────────────────────
  notify-slack:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: run-tests
    if: ${{ always() && (inputs.notify_slack != false) }}
    
    steps:
      - name: Download Report
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: ./test-results/

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload-file-path: './test-results/slack-payload.json'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ──────────────────────────────────────────────────────────────────────────
  # Job: Upload Report to Confluence
  # ──────────────────────────────────────────────────────────────────────────
  upload-confluence:
    name: Upload to Confluence
    runs-on: ubuntu-latest
    needs: run-tests
    if: ${{ always() && (inputs.upload_confluence != false) }}
    
    steps:
      - name: Download Report
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: ./test-results/

      - name: Upload Report to Confluence
        run: |
          node << 'EOF'
          const fs = require('fs');
          const https = require('https');
          
          const { CONFLUENCE_URL, CONFLUENCE_USERNAME, CONFLUENCE_API_TOKEN, CONFLUENCE_SPACE_KEY, CONFLUENCE_PARENT_PAGE_ID } = process.env;
          
          if (!CONFLUENCE_URL || !CONFLUENCE_USERNAME || !CONFLUENCE_API_TOKEN) {
            console.log('⚠️ Confluence credentials not configured. Skipping.');
            process.exit(0);
          }
          
          const reportJson = JSON.parse(fs.readFileSync('./test-results/report.json', 'utf8'));
          const date = new Date().toISOString().split('T')[0];
          const status = (reportJson.summary.failing > 0 || reportJson.summary.lowCoverageCount > 0) ? '❌' : '✅';
          
          const storageFormat = `
            <h1>${status} Salesforce Test Report - ${date}</h1>
            <p><strong>Generated:</strong> ${reportJson.summary.timestamp}</p>
            <p><a href="${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}">View on GitHub</a></p>
            <h2>Summary</h2>
            <table>
              <tr><th>Metric</th><th>Value</th></tr>
              <tr><td>Tests Run</td><td>${reportJson.summary.testsRan}</td></tr>
              <tr><td>Passing</td><td>${reportJson.summary.passing}</td></tr>
              <tr><td>Failing</td><td>${reportJson.summary.failing}</td></tr>
              <tr><td>Pass Rate</td><td>${reportJson.summary.passRate}</td></tr>
              <tr><td>Low Coverage Classes</td><td>${reportJson.summary.lowCoverageCount}</td></tr>
            </table>
          `;
          
          const payload = {
            type: 'page',
            title: `${status} Salesforce Test Report - ${date}`,
            space: { key: CONFLUENCE_SPACE_KEY || 'TEST' },
            body: { storage: { value: storageFormat, representation: 'storage' } },
            ...(CONFLUENCE_PARENT_PAGE_ID && { ancestors: [{ id: CONFLUENCE_PARENT_PAGE_ID }] })
          };
          
          const url = new URL(`${CONFLUENCE_URL}/rest/api/content`);
          const req = https.request({
            hostname: url.hostname,
            port: url.port || 443,
            path: url.pathname,
            method: 'POST',
            headers: {
              'Authorization': `Basic ${Buffer.from(`${CONFLUENCE_USERNAME}:${CONFLUENCE_API_TOKEN}`).toString('base64')}`,
              'Content-Type': 'application/json'
            }
          }, res => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', () => {
              if (res.statusCode >= 200 && res.statusCode < 300) {
                const response = JSON.parse(data);
                console.log(`✅ Uploaded to Confluence: ${CONFLUENCE_URL}${response._links.webui}`);
              } else {
                console.error(`❌ Confluence upload failed: ${res.statusCode} - ${data}`);
                process.exit(1);
              }
            });
          });
          
          req.on('error', e => { console.error(`❌ Error: ${e.message}`); process.exit(1); });
          req.write(JSON.stringify(payload));
          req.end();
          EOF
        env:
          CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
          CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
          CONFLUENCE_PARENT_PAGE_ID: ${{ secrets.CONFLUENCE_PARENT_PAGE_ID }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}