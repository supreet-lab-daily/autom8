# Scheduled Salesforce Test Runner
# Runs Apex tests weekly on Friday at 3:00 AM IST against the
# release-calendar sandbox (TEST1 or TEST2).
# Schedule is driven by scripts/release-schedule.json.

name: Scheduled Salesforce Test Runner

on:
  schedule:
    # Friday 3:00 AM IST = Thursday 21:30 UTC
    - cron: '30 21 * * 4'

  workflow_dispatch:
    inputs:
      sandbox:
        description: 'Target Sandbox (AUTO reads release-schedule.json)'
        required: true
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - TEST1
          - TEST2
          - BOTH
      test_level:
        description: 'Test Level'
        required: true
        default: 'RunLocalTests'
        type: choice
        options:
          - RunLocalTests
          - RunAllTestsInOrg
          - RunSpecifiedTests
      specified_tests:
        description: 'Comma-separated test classes (only for RunSpecifiedTests)'
        required: false
        default: ''
      coverage_threshold:
        description: 'Coverage threshold percentage'
        required: false
        default: '95'
      commit_report:
        description: 'Commit report to repository'
        required: false
        default: true
        type: boolean

env:
  COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold || '95' }}
  REPORTS_DIR: 'test-reports'
  TEST_LEVEL: ${{ inputs.test_level || 'RunLocalTests' }}

# ──────────────────────────────────────────────────────────────
jobs:
  # ── 1. Resolve which sandbox(es) to target ─────────────────
  determine-sandbox:
    name: Determine Target Sandbox
    runs-on: ubuntu-latest
    outputs:
      sandboxes: ${{ steps.resolve.outputs.sandboxes }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/release-schedule.json

      - name: Resolve Target Sandbox
        id: resolve
        run: |
          node << 'SCRIPT'
          const fs = require('fs');

          const manual = '${{ inputs.sandbox }}' || 'AUTO';

          if (['TEST1', 'TEST2'].includes(manual)) {
            finish([manual]);
          } else if (manual === 'BOTH') {
            finish(['TEST1', 'TEST2']);
          } else {
            const config = JSON.parse(
              fs.readFileSync('./scripts/release-schedule.json', 'utf8')
            );

            // Schedule dates are IST-based; convert runner UTC clock to IST
            const now   = new Date();
            const istMs = now.getTime() + 5.5 * 60 * 60 * 1000;
            const today = new Date(istMs).toISOString().split('T')[0];

            const matched = new Set();
            for (const entry of config.schedule) {
              if (today >= entry.start && today <= entry.end) {
                matched.add(entry.sandbox);
              }
            }

            // Gap week (no matching window) → run both sandboxes
            const sandboxes = matched.size > 0
              ? [...matched]
              : ['TEST1', 'TEST2'];

            console.log(`Schedule date (IST): ${today}`);
            finish(sandboxes);
          }

          function finish(sandboxes) {
            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, `sandboxes=${JSON.stringify(sandboxes)}\n`);
            console.log(`Target sandbox(es): ${sandboxes.join(', ')}`);
          }
          SCRIPT

  # ── 2. Run Apex tests (one job per sandbox) ────────────────
  run-tests:
    name: Execute Apex Tests (${{ matrix.sandbox }})
    needs: determine-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        sandbox: ${{ fromJSON(needs.determine-sandbox.outputs.sandboxes) }}
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Sandbox
        run: |
          if [ "${{ matrix.sandbox }}" = "TEST1" ]; then
            echo "${{ secrets.TEST1_AUTH_URL }}" > auth_url.txt
          else
            echo "${{ secrets.TEST2_AUTH_URL }}" > auth_url.txt
          fi

          sf org login sfdx-url \
            --sfdx-url-file auth_url.txt \
            --alias ${{ matrix.sandbox }} \
            --set-default
          rm auth_url.txt

      - name: Verify Org Connection
        run: sf org display --target-org ${{ matrix.sandbox }}

      - name: Run Apex Tests
        id: run-tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ./test-results

          TEST_LEVEL="${{ env.TEST_LEVEL }}"
          SPECIFIED_TESTS="${{ inputs.specified_tests }}"

          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" && -z "$SPECIFIED_TESTS" ]]; then
            echo "::error::No test classes specified for RunSpecifiedTests"
            exit 1
          fi

          if [[ "$TEST_LEVEL" == "RunSpecifiedTests" ]]; then
            echo "Running specified tests on ${{ matrix.sandbox }}: $SPECIFIED_TESTS"
            sf apex run test \
              --target-org "${{ matrix.sandbox }}" \
              --class-names "$SPECIFIED_TESTS" \
              --code-coverage \
              --result-format json \
              --output-dir ./test-results \
              --wait 30 || TEST_EXIT=$?
          else
            echo "Running $TEST_LEVEL on ${{ matrix.sandbox }}"
            sf apex run test \
              --target-org "${{ matrix.sandbox }}" \
              --test-level "$TEST_LEVEL" \
              --code-coverage \
              --result-format json \
              --output-dir ./test-results \
              --wait 30 || TEST_EXIT=$?
          fi

          TEST_EXIT=${TEST_EXIT:-0}

          RESULT_FILE=$(find ./test-results -name "test-result-*.json" -type f \
            ! -name "*-codecoverage.json" ! -name "*-junit.xml" | head -1)

          if [[ -z "$RESULT_FILE" ]]; then
            echo "::error::No test result file found"
            exit 1
          fi

          cp "$RESULT_FILE" ./test-results/test-results.json

          # Fail only on execution errors, not test failures (exit 100)
          if [[ $TEST_EXIT -ne 0 && $TEST_EXIT -ne 100 ]]; then
            exit $TEST_EXIT
          fi

      - name: Analyze Results
        id: analyze
        env:
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}
          SANDBOX_NAME: ${{ matrix.sandbox }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const sandboxName = process.env.SANDBOX_NAME;
          const rawData = JSON.parse(fs.readFileSync('./test-results/test-results.json', 'utf8'));
          if (Array.isArray(rawData)) {
            console.error('Invalid test results format');
            process.exit(1);
          }

          const testData  = rawData.result || rawData;
          const summary   = testData.summary || {};
          const tests     = testData.tests || [];
          const threshold = parseFloat(process.env.COVERAGE_THRESHOLD || '95');

          // ── Coverage ──
          let coverageData = testData.coverage?.coverage || [];
          if (!coverageData.length) {
            const coverageFile = './test-results/test-result-codecoverage.json';
            if (fs.existsSync(coverageFile)) {
              const data = JSON.parse(fs.readFileSync(coverageFile, 'utf8'));
              coverageData = Array.isArray(data) ? data : [];
            }
          }

          const coverage = coverageData.map(c => {
            const covered = parseInt(c.totalCovered || c.numLinesCovered || 0);
            const total   = parseInt(c.totalLines || 0);
            return {
              className: c.name || c.apexClassOrTrigger?.name || 'Unknown',
              linesCovered: covered,
              totalLines: total,
              coveragePercentage: total > 0 ? Math.round((covered / total) * 10000) / 100 : 0
            };
          });

          const lowCoverage = coverage
            .filter(c => c.coveragePercentage < threshold && c.totalLines > 0)
            .sort((a, b) => a.coveragePercentage - b.coveragePercentage);

          // ── Failures ──
          const failuresByClass = {};
          tests.filter(t => (t.Outcome || t.outcome) === 'Fail').forEach(t => {
            const className = t.ApexClass?.Name || t.ClassName || t.apexClass?.name || 'Unknown';
            if (!failuresByClass[className]) failuresByClass[className] = { className, methods: [] };
            failuresByClass[className].methods.push({
              methodName: t.MethodName || t.methodName,
              message: t.Message || t.message
            });
          });

          // ── Git blame ──
          function getLastCommitter(className) {
            const paths = [
              `force-app/main/default/classes/${className}.cls`,
              `src/classes/${className}.cls`
            ];
            for (const p of paths) {
              if (fs.existsSync(p)) {
                try {
                  const result = execSync(
                    `git log -1 --format="%an|%aI" -- "${p}"`,
                    { encoding: 'utf8', timeout: 5000 }
                  ).trim();
                  if (result) {
                    const [name, date] = result.split('|');
                    return { name, date: date?.split('T')[0] };
                  }
                } catch (e) { /* ignore */ }
              }
            }
            return null;
          }

          Object.values(failuresByClass).forEach(f => f.lastCommitter = getLastCommitter(f.className));
          lowCoverage.forEach(c => c.lastCommitter = getLastCommitter(c.className));

          // ── Report model ──
          const now        = new Date();
          const reportDate = now.toISOString().split('T')[0];

          const report = {
            sandbox: sandboxName,
            summary: {
              testsRan: parseInt(summary.testsRan) || tests.length || 0,
              passing:  parseInt(summary.passing) || 0,
              failing:  parseInt(summary.failing) || 0,
              passRate: summary.passRate || '0%',
              testRunId: summary.testRunId || 'N/A',
              orgWideCoverage: summary.orgWideCoverage || 'N/A',
              timestamp: now.toISOString(),
              reportDate
            },
            failingClasses: Object.values(failuresByClass),
            lowCoverageClasses: lowCoverage.slice(0, 15)
          };

          fs.writeFileSync('./test-results/report.json', JSON.stringify(report, null, 2));

          // ── Metadata (used by the commit job) ──
          fs.writeFileSync('./test-results/metadata.json', JSON.stringify({
            sandbox:    sandboxName,
            reportDate,
            total:      report.summary.testsRan,
            passing:    report.summary.passing,
            failing:    report.summary.failing,
            passRate:   report.summary.passRate
          }, null, 2));

          // ── Markdown ──
          const isHealthy = report.summary.failing === 0 && lowCoverage.length === 0;
          let md = `# ${isHealthy ? '✅' : '🔴'} Apex Test Report — ${sandboxName}\n\n`;
          md += `**Sandbox:** ${sandboxName}  \n`;
          md += `**Date:** ${report.summary.timestamp}  \n`;
          md += `**Test Run ID:** ${report.summary.testRunId}\n\n`;
          md += '## Summary\n\n';
          md += '| Metric | Value |\n|--------|-------|\n';
          md += `| Tests Run | ${report.summary.testsRan} |\n`;
          md += `| Passing | ✅ ${report.summary.passing} |\n`;
          md += `| Failing | ${report.summary.failing > 0 ? '❌' : '✅'} ${report.summary.failing} |\n`;
          md += `| Pass Rate | ${report.summary.passRate} |\n`;
          md += `| Org Coverage | ${report.summary.orgWideCoverage} |\n\n`;

          if (report.failingClasses.length > 0) {
            md += '## ❌ Failing Tests\n\n';
            report.failingClasses.forEach(f => {
              md += `### \`${f.className}\`\n`;
              if (f.lastCommitter) md += `Last modified by ${f.lastCommitter.name} on ${f.lastCommitter.date}\n\n`;
              f.methods.forEach(m => {
                md += `- \`${m.methodName}\`${m.message ? ': ' + m.message.substring(0, 100) : ''}\n`;
              });
              md += '\n';
            });
          }

          if (lowCoverage.length > 0) {
            md += `## 📉 Low Coverage (< ${threshold}%)\n\n`;
            md += '| Class | Coverage | Lines |\n|-------|----------|-------|\n';
            lowCoverage.slice(0, 15).forEach(c => {
              md += `| \`${c.className}\` | ${c.coveragePercentage.toFixed(1)}% | ${c.linesCovered}/${c.totalLines} |\n`;
            });
          }

          fs.writeFileSync('./test-results/report.md', md);

          // ── HTML ──
          let html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>';
          html += 'body{font-family:Arial,sans-serif;max-width:800px;margin:20px auto;padding:20px}';
          html += 'table{width:100%;border-collapse:collapse;margin:20px 0}';
          html += 'th,td{padding:10px;text-align:left;border-bottom:1px solid #ddd}';
          html += 'th{background:#f5f5f5}.pass{color:#28a745}.fail{color:#dc3545}';
          html += '</style></head><body>';
          html += `<h1>${isHealthy ? '✅' : '🔴'} Apex Test Report — ${sandboxName}</h1>`;
          html += `<p><strong>Sandbox:</strong> ${sandboxName}</p>`;
          html += `<p><strong>Date:</strong> ${report.summary.timestamp}</p>`;
          html += '<table><tr><th>Metric</th><th>Value</th></tr>';
          html += `<tr><td>Tests Run</td><td>${report.summary.testsRan}</td></tr>`;
          html += `<tr><td>Passing</td><td class="pass">${report.summary.passing}</td></tr>`;
          html += `<tr><td>Failing</td><td class="${report.summary.failing > 0 ? 'fail' : 'pass'}">${report.summary.failing}</td></tr>`;
          html += `<tr><td>Pass Rate</td><td>${report.summary.passRate}</td></tr>`;
          html += '</table></body></html>';

          fs.writeFileSync('./test-results/report.html', html);

          // ── Outputs ──
          const out = process.env.GITHUB_OUTPUT;
          if (out) {
            fs.appendFileSync(out, `has_failures=${report.summary.failing > 0}\n`);
            fs.appendFileSync(out, `has_low_coverage=${lowCoverage.length > 0}\n`);
            fs.appendFileSync(out, `report_date=${reportDate}\n`);
            fs.appendFileSync(out, `summary_passing=${report.summary.passing}\n`);
            fs.appendFileSync(out, `summary_failing=${report.summary.failing}\n`);
            fs.appendFileSync(out, `summary_total=${report.summary.testsRan}\n`);
            fs.appendFileSync(out, `summary_pass_rate=${report.summary.passRate}\n`);
          }

          console.log(`✅ ${sandboxName} report: ${report.summary.failing} failures, ${lowCoverage.length} low-coverage classes`);
          EOF

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.sandbox }}-${{ steps.analyze.outputs.report_date }}
          path: ./test-results/
          retention-days: 30

      - name: Post Summary
        if: always()
        run: |
          if [ -f ./test-results/report.md ]; then
            cat ./test-results/report.md >> $GITHUB_STEP_SUMMARY
          fi

  # ── 3. Commit reports to the repository ────────────────────
  commit-report:
    name: Commit Test Reports
    runs-on: ubuntu-latest
    needs: [determine-sandbox, run-tests]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.commit_report == true) }}

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download All Report Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: ./downloaded-reports/

      - name: Organize and Commit Reports
        shell: bash
        run: |
          COMMIT_LINES=""

          for ARTIFACT_DIR in ./downloaded-reports/test-results-*/; do
            [ -d "$ARTIFACT_DIR" ] || continue

            META="${ARTIFACT_DIR}metadata.json"
            if [ ! -f "$META" ]; then
              echo "⚠️  No metadata in ${ARTIFACT_DIR}, skipping"
              continue
            fi

            SANDBOX=$(node -e    "process.stdout.write(JSON.parse(require('fs').readFileSync('$META','utf8')).sandbox)")
            REPORT_DATE=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('$META','utf8')).reportDate)")
            FAILING=$(node -e    "process.stdout.write(String(JSON.parse(require('fs').readFileSync('$META','utf8')).failing))")
            TOTAL=$(node -e      "process.stdout.write(String(JSON.parse(require('fs').readFileSync('$META','utf8')).total))")

            YEAR=$(echo "$REPORT_DATE" | cut -d'-' -f1)
            MONTH=$(echo "$REPORT_DATE" | cut -d'-' -f2)
            REPORT_DIR="${{ env.REPORTS_DIR }}/${SANDBOX}/${YEAR}/${MONTH}"
            REPORT_SUBDIR="${REPORT_DIR}/${REPORT_DATE}"

            mkdir -p "${REPORT_SUBDIR}"
            cp "${ARTIFACT_DIR}report.json" "${REPORT_SUBDIR}/" 2>/dev/null || true
            cp "${ARTIFACT_DIR}report.md"   "${REPORT_SUBDIR}/" 2>/dev/null || true
            cp "${ARTIFACT_DIR}report.html" "${REPORT_SUBDIR}/" 2>/dev/null || true

            # Update per-sandbox month index
            INDEX_FILE="${REPORT_DIR}/README.md"
            if [ ! -f "${INDEX_FILE}" ]; then
              echo -e "# ${SANDBOX} Test Reports — ${MONTH}/${YEAR}\n\n## Reports\n" > "${INDEX_FILE}"
            fi

            if [ "${FAILING:-0}" -gt 0 ]; then STATUS="🔴"; else STATUS="✅"; fi

            REPORT_LINE="- ${STATUS} [${REPORT_DATE}](./${REPORT_DATE}/report.md) — ${TOTAL} tests, ${FAILING} failures"

            {
              head -n 4 "${INDEX_FILE}"
              echo "${REPORT_LINE}"
              tail -n +5 "${INDEX_FILE}"
            } > "${INDEX_FILE}.tmp" && mv "${INDEX_FILE}.tmp" "${INDEX_FILE}"

            COMMIT_LINES="${COMMIT_LINES}${STATUS} ${SANDBOX} ${REPORT_DATE}: ${TOTAL} tests, ${FAILING} failures\n"
          done

          # Root index per sandbox
          for SANDBOX_DIR in ${{ env.REPORTS_DIR }}/TEST*/; do
            [ -d "$SANDBOX_DIR" ] || continue
            SANDBOX_NAME=$(basename "$SANDBOX_DIR")
            ROOT_INDEX="${SANDBOX_DIR}README.md"
            echo "# ${SANDBOX_NAME} — Salesforce Test Reports" > "${ROOT_INDEX}"
            echo "" >> "${ROOT_INDEX}"
            echo "## Latest Reports" >> "${ROOT_INDEX}"
            echo "" >> "${ROOT_INDEX}"

            find "${SANDBOX_DIR}" -name "report.md" -type f -print0 2>/dev/null | \
              xargs -0 ls -t 2>/dev/null | head -10 | while read -r filepath; do
              REPORT_DATE_VAL=$(echo "$filepath" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
              if [ -n "$REPORT_DATE_VAL" ]; then
                REL_PATH="${filepath#${SANDBOX_DIR}}"
                echo "- [${REPORT_DATE_VAL}](./${REL_PATH})" >> "${ROOT_INDEX}"
              fi
            done
          done

          # Commit
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.REPORTS_DIR }}/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          COMMIT_MSG=$(printf "test: weekly report\n\n%b" "$COMMIT_LINES")
          git commit -m "$COMMIT_MSG"
          git push
          echo "✅ Reports committed"
